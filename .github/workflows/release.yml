name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: segnale_debole

jobs:
  build:
    name: Build ${{ matrix.variant.prefix }}-${{ matrix.target.suffix }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            suffix: linux-x86_64.tar.gz
            exe: ""
          - os: windows-latest
            suffix: windows-x86_64.zip
            exe: ".exe"
          - os: macos-latest
            suffix: macos-aarch64.tar.gz
            exe: ""
        # Standard raster build + GPU ray-traced lighting build (Bevy Solari;
        # falls back to raster at runtime on GPUs without ray queries).
        variant:
          - prefix: segnale-debole
            features: audio
          - prefix: segnale-debole-raytracing
            features: audio,raytracing
    env:
      ARCHIVE: ${{ matrix.variant.prefix }}-${{ matrix.target.suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target.os }}-${{ matrix.variant.prefix }}

      - name: Build release binary (features ${{ matrix.variant.features }})
        run: cargo build --release --features ${{ matrix.variant.features }}

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist/segnale-debole
          cp "target/release/${BIN}${{ matrix.target.exe }}" dist/segnale-debole/
          cp README.md dist/segnale-debole/

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "$ARCHIVE" segnale-debole

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/segnale-debole -DestinationPath "$env:ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

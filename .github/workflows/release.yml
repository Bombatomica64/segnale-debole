name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: segnale_debole

jobs:
  build:
    name: Build ${{ matrix.variant.prefix }}-${{ matrix.target.suffix }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux-only native builds for now (Windows/macOS disabled to save CI time).
        target:
          - os: ubuntu-latest
            suffix: linux-x86_64.tar.gz
            exe: ""
        # Standard raster build + GPU ray-traced lighting build (Bevy Solari;
        # falls back to raster at runtime on GPUs without ray queries). Both
        # ship native controller support (gilrs; links libudev).
        variant:
          - prefix: segnale-debole
            features: audio,gamepad
          - prefix: segnale-debole-raytracing
            features: audio,gamepad,raytracing
    env:
      ARCHIVE: ${{ matrix.variant.prefix }}-${{ matrix.target.suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target.os }}-${{ matrix.variant.prefix }}

      - name: Build release binary (features ${{ matrix.variant.features }})
        run: cargo build --release --features ${{ matrix.variant.features }}

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist/segnale-debole
          cp "target/release/${BIN}${{ matrix.target.exe }}" dist/segnale-debole/
          cp README.md dist/segnale-debole/

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "$ARCHIVE" segnale-debole

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/segnale-debole -DestinationPath "$env:ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  build-web:
    name: Build web (WebGL2 / itch.io HTML5)
    runs-on: ubuntu-latest
    env:
      ARCHIVE: segnale-debole-web-itch.zip
      TRUNK_VERSION: v0.22.2
      BINARYEN_VERSION: version_131
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web

      - name: Install trunk + binaryen (wasm-opt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # trunk fetches the wasm-bindgen CLI matching Cargo.lock; the
      # `wasm-release` profile is size-tuned (see Cargo.toml).
      - name: trunk build (release, audio)
        run: trunk build --release --features audio --cargo-profile wasm-release

      # itch.io requires index.html at the zip root.
      - name: Package for itch.io
        run: |
          cd dist
          zip -r -9 "../$ARCHIVE" . -x '.*'
          cd ..
          unzip -l "$ARCHIVE"
          unzip -l "$ARCHIVE" | grep -qE ' index\.html$'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  build-android:
    name: Build Android (arm64-v8a APK)
    runs-on: ubuntu-latest
    env:
      ARCHIVE: segnale-debole-android-arm64.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # ubuntu-latest ships the Android SDK (platform 35, build-tools) and NDK
      # (`ANDROID_HOME`, `ANDROID_NDK_HOME`). Configure optional release signing
      # secrets (`ANDROID_KEYSTORE_B64`, `ANDROID_KEYSTORE_PASSWORD`,
      # `ANDROID_KEY_ALIAS`, `ANDROID_KEY_PASSWORD`) for stable in-place updates;
      # otherwise falls back to debug signing so artifacts stay sideloadable.
      - name: Decode optional Android release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK (cargo ndk + gradlew assembleRelease)
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.1' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: OUT="$ARCHIVE" android/build-apk.sh --release

      - name: Inspect APK
        run: |
          unzip -l "$ARCHIVE" | grep -E 'lib/arm64-v8a/libsegnale_debole\.so$'
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/aapt2"
          "$aapt2" dump badging "$ARCHIVE" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-web, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

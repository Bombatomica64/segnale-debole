name: Deploy images (web + API)

# Builds the WebGL2 bundle + the segnale_server API and publishes both images
# to GHCR. The k3s box itself deploys with deploy/deploy-k3s.sh (local images).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "server/**"
      - "deploy/**"
      - "index.html"
      - "Trunk.toml"
      - "Cargo.*"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2
  BINARYEN_VERSION: version_131

jobs:
  images:
    name: Build & push web + API images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web

      - name: Install trunk + binaryen (wasm-opt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: trunk build (release, audio)
        run: trunk build --release --features audio --cargo-profile wasm-release

      # GHCR image names must be lowercase; repository_owner may not be.
      - name: Lowercase owner
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/segnale-debole-web
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/segnale-debole-api
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push web (nginx + dist/)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Build & push API (segnale_server)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=segnale-debole-api
          cache-to: type=gha,mode=max,scope=segnale-debole-api

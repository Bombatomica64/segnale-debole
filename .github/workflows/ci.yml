name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, clippy & audio check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Unit + headless ECS integration tests (incl. 5 playtest bot seeds)
        run: cargo test

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check full audio feature (0 warnings)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --all-targets --features audio

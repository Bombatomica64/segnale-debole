apiVersion: v1
kind: Namespace
metadata:
  name: segnale-debole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segnale-debole
  namespace: segnale-debole
  labels:
    app.kubernetes.io/name: segnale-debole
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: segnale-debole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: segnale-debole
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/library/segnale-debole-web:v0.3.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: segnale-debole
  namespace: segnale-debole
spec:
  selector:
    app.kubernetes.io/name: segnale-debole
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: segnale-debole
  namespace: segnale-debole
spec:
  ingressClassName: traefik
  rules:
    - host: signal.bombatomica64.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: segnale-debole
                port:
                  name: http

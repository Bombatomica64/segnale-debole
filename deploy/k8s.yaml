# Segnale Debole: separate nginx (static WASM build + /api/ reverse proxy) and
# segnale_server API Deployments so a Postgres outage never takes the static
# game out of service. Images are imported straight into k3s's containerd
# (deploy/deploy-k3s.sh), hence imagePullPolicy: Never.
#
# Secrets (DATABASE_URL, OIDC_CLIENT_SECRET) come from a Secret that is NOT in
# this file. Create it once before applying (placeholders, never commit values):
#
#   kubectl -n segnale-debole create secret generic segnale-debole-secrets \
#     --from-literal=DATABASE_URL='postgres://<user>:<password>@<host>:5432/<db>' \
#     --from-literal=OIDC_CLIENT_SECRET='<client secret from Authentik>'
#
apiVersion: v1
kind: Namespace
metadata:
  name: segnale-debole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segnale-debole
  namespace: segnale-debole
  labels:
    app.kubernetes.io/name: segnale-debole
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: segnale-debole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: segnale-debole
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/library/segnale-debole-web:v0.5.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: segnale-debole-api
  namespace: segnale-debole
  labels:
    app.kubernetes.io/name: segnale-debole-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: segnale-debole-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: segnale-debole-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/library/segnale-debole-api:v0.5.0
          imagePullPolicy: Never
          ports:
            - name: api
              containerPort: 8081
          env:
            - name: SERVER_BIND
              value: "0.0.0.0:8081"
            - name: PUBLIC_BASE_URL
              value: "https://signal.bombatomica64.dev"
            - name: COOKIE_SECURE
              value: "true"
            - name: OIDC_CLIENT_ID
              value: "segnale-debole"
            - name: OIDC_AUTHORIZE_URL
              value: "https://auth.bombatomica64.dev/application/o/authorize/"
            - name: OIDC_TOKEN_URL
              value: "https://auth.bombatomica64.dev/application/o/token/"
            - name: OIDC_USERINFO_URL
              value: "https://auth.bombatomica64.dev/application/o/userinfo/"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: segnale-debole-secrets
                  key: DATABASE_URL
                  optional: false
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: segnale-debole-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: false
          # Process-only liveness so a temporary Postgres outage never restarts
          # the API pod or discards pending OIDC logins.
          livenessProbe:
            httpGet:
              path: /api/v1/livez
              port: api
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: api
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: segnale-debole
  namespace: segnale-debole
spec:
  selector:
    app.kubernetes.io/name: segnale-debole
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: segnale-debole-api
  namespace: segnale-debole
spec:
  selector:
    app.kubernetes.io/name: segnale-debole-api
  ports:
    - name: api
      port: 8081
      targetPort: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: segnale-debole
  namespace: segnale-debole
spec:
  ingressClassName: traefik
  rules:
    - host: signal.bombatomica64.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: segnale-debole
                port:
                  name: http

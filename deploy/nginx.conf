worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/wasm wasm;
    }

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;

    # Traefik terminates TLS in front of this pod: pass its X-Forwarded-Proto
    # through to the API, falling back to our own scheme when absent.
    map $http_x_forwarded_proto $segnale_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Only trust CF-Connecting-IP when arriving from cluster / loopback ingress
    # peers (Traefik / cloudflared); overwrite X-Client-IP with one canonical
    # address so callers cannot spoof rate-limit buckets.
    geo $segnale_trusted_ingress {
        default        0;
        127.0.0.1/32   1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
    }
    map "$segnale_trusted_ingress:$http_cf_connecting_ip" $segnale_client_ip {
        "~^1:(.+)$" $1;
        default     $remote_addr;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Backend API Service (separate Deployment so a Postgres outage never
        # removes the static game pod from service). Dynamic DNS resolution keeps
        # nginx booting cleanly even if the API Service has no ready endpoints.
        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
            set $api_upstream "http://segnale-debole-api.segnale-debole.svc.cluster.local:8081";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $segnale_forwarded_proto;
            proxy_set_header X-Client-IP $segnale_client_ip;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            client_max_body_size 128k;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(wasm|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ /index.html;
        }
    }
}

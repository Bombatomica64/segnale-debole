[package]
name = "segnale_debole"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "ui_bevy_render",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "custom_cursor",
    "png",
] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
audio = ["bevy/bevy_audio", "bevy/wav"]

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

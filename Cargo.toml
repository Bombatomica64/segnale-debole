[package]
name = "segnale_debole"
version = "0.4.0"
edition = "2024"

# `cdylib` is the Android `libsegnale_debole.so` that GameActivity loads (built
# by `cargo ndk`, see `android/build-apk.sh`); `rlib` keeps the native binary,
# integration tests and benches linking against the library as before.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Minimal Bevy 0.20 feature set: omit unused asset/FX crates (bevy_gltf,
# bevy_animation, morph, bevy_gizmos, bevy_anti_alias/smaa_luts, hdr,
# bevy_post_process, bevy_mikktspace, bevy_curve; bevy_gilrs is opt-in via the
# `gamepad` feature and always on for wasm32) since all
# meshes, textures, animations and audio are procedural. `tonemapping_luts`
# (+ `zstd_rust` for its embedded LUT) stays on so TonyMcMapface renders
# identically across all platforms.
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "default_font",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "bevy_light",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_ui",
    "bevy_ui_render",
    "tonemapping_luts",
    "zstd_rust",
] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only Bevy features (desktop and Android): multithreaded task pools.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }

# Desktop-only Bevy features: OS cursors and PNG screenshot encoding (for
# dev/bot tours; never needed on wasm32 or Android).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["custom_cursor", "png"] }

# Android (`cargo ndk -t arm64-v8a build`, see `android/`): GameActivity
# backend + audio. cpal 0.17 drives AAudio through the NDK (no Oboe, so no
# `libc++_shared.so`; android-activity links `c++_static`). No `bevy_gilrs`:
# gilrs 0.11 has no Android backend (it compiles to a dummy that never sees a
# device) and winit 0.30 drops joystick motion events, so controllers and the
# mouse reach Bevy through the JNI bridge in `src/android_input.rs`.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["android-game-activity", "bevy_audio", "wav"] }

# Linux windowing backends (native only; never compiled into the web build).
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11", "wayland"] }

# Web / itch.io build (`trunk build --release --features audio`): WebGL2
# renderer, browser time/RNG backends, browser UTC clock + localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `bevy_gilrs` on wasm32 drives the browser Gamepad API (no native C deps).
bevy = { version = "0.20.1", default-features = false, features = ["webgl2", "web", "bevy_gilrs"] }
# rand 0.9 -> rand_core -> getrandom 0.3 (the only getrandom in the wasm graph).
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "Location"] }

[features]
default = []
audio = ["bevy/bevy_audio", "bevy/wav"]
raytracing = ["bevy/bevy_solari"]
# Native desktop controllers (gilrs). Opt-in: on Linux it links `libudev`
# (`libudev-dev` to build), which the default build stays free of. Without it
# `src/gamepad.rs` still compiles; it just never sees a device.
gamepad = ["bevy/bevy_gilrs"]

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Web / itch.io build: size-tuned release (`trunk build --release --features
# audio --cargo-profile wasm-release`). Fat LTO + `opt-level = "s"` +
# `panic = "abort"` keep the wasm module compact while native release stays
# speed-tuned. Keep `strip = "none"` so `wasm-bindgen` can read the
# `target_features` custom section before `wasm-opt -Oz` strips the output.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = "none"

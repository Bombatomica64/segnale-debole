[package]
name = "segnale_debole"
version = "0.3.0"
edition = "2024"

[dependencies]
# Minimal Bevy 0.20 feature set: omit unused asset/FX crates (bevy_gltf,
# bevy_animation, morph, bevy_gizmos, bevy_anti_alias/smaa_luts, hdr,
# bevy_post_process, bevy_mikktspace, bevy_curve, bevy_gilrs) since all
# meshes, textures, animations and audio are procedural. `tonemapping_luts`
# (+ `zstd_rust` for its embedded LUT) stays on so TonyMcMapface renders
# identically across all platforms.
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "default_font",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "bevy_light",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_ui",
    "bevy_ui_render",
    "tonemapping_luts",
    "zstd_rust",
] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only Bevy features: multithreaded task pools, OS cursors, and PNG
# screenshot encoding (for dev/bot tours; never needed on wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "multi_threaded",
    "custom_cursor",
    "png",
] }

# Linux windowing backends (native only; never compiled into the web build).
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11", "wayland"] }

# Web / itch.io build (`trunk build --release --features audio`): WebGL2
# renderer, browser time/RNG backends, browser UTC clock + localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["webgl2", "web"] }
# rand 0.9 -> rand_core -> getrandom 0.3 (the only getrandom in the wasm graph).
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "Location"] }

[features]
default = []
audio = ["bevy/bevy_audio", "bevy/wav"]
raytracing = ["bevy/bevy_solari"]

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Web / itch.io build: size-tuned release (`trunk build --release --features
# audio --cargo-profile wasm-release`). Fat LTO + `opt-level = "s"` +
# `panic = "abort"` keep the wasm module compact while native release stays
# speed-tuned. Keep `strip = "none"` so `wasm-bindgen` can read the
# `target_features` custom section before `wasm-opt -Oz` strips the output.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = "none"
